name: Update and Download EXTENSIONS_CATALOG

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'GitHub Gist ID to scan for synced extensions with valid Chromium & Firefox IDs/URLs'
        required: false
        type: string
      force:
        description: 'Force re-download all XPI files even if version matches'
        required: false
        default: false
        type: boolean
  schedule:
    # Run weekly on Mondays at 03:00 UTC
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  update-and-download-catalog:
    name: Update and Download EXTENSIONS_CATALOG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1. Sync catalog.js to dist/firefox and dist/chromium
        run: npm run build

      - name: 2. Update KNOWN_EXTENSIONS_CATALOG with gist content
        env:
          GIST_ID: ${{ inputs.gist_id || secrets.GIST_ID || vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node scripts/update-catalog.mjs

      - name: 3. Download/update xpi files
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/download-xpi.mjs --force
          else
            node scripts/download-xpi.mjs
          fi

      - name: 4. Update xpi file path in KNOWN_EXTENSIONS_CATALOG
        run: node scripts/update-catalog-xpi-paths.mjs

      - name: 5. Sync updated catalog.js to dist/firefox and dist/chromium and run tests
        run: |
          npm run build
          npm test

      - name: Commit and push updated catalog and XPI files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/catalog.js xpi-files/ dist/
          if git diff --staged --quiet; then
            echo "No changes in KNOWN_EXTENSIONS_CATALOG or xpi-files/ to commit."
          else
            git commit -m "chore(catalog): update KNOWN_EXTENSIONS_CATALOG and download XPI files"
            git push
          fi

