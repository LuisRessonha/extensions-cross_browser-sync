name: Update KNOWN_EXTENSIONS_CATALOG

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'GitHub Gist ID to scan for extensions with valid Firefox & Chromium IDs/URLs'
        required: false
        type: string
  schedule:
    # Run weekly on Mondays at 03:00 UTC (before the XPI download workflow at 04:00 UTC)
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  update-catalog:
    name: Validate & Add Entries to KNOWN_EXTENSIONS_CATALOG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate candidates from Gist and update KNOWN_EXTENSIONS_CATALOG
        env:
          GIST_ID: ${{ inputs.gist_id || vars.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node scripts/update-catalog.mjs

      - name: Rebuild extension packages and run tests if catalog changed
        run: |
          if ! git diff --quiet src/shared/catalog.js; then
            npm run build
            npm test
          fi

      - name: Commit and push updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/catalog.js dist/
          if git diff --staged --quiet; then
            echo "No new catalog entries to commit."
          else
            git commit -m "chore(catalog): add validated cross-browser extension entries"
            git push
          fi

